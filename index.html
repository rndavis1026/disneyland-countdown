<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown to Disneyland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night-top: #140a1f;
    --night-mid: #2b1240;
    --night-bottom: #4a1f3d;
    --pumpkin: #ff8a1e;
    --pumpkin-dark: #d9660a;
    --slime: #7ee08a;
    --ghost: #f3ead9;
    --purple: #7a4fb5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 45%, var(--night-bottom) 100%);
    color: var(--ghost);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 48px;
    position: relative;
    overflow-x: hidden;
  }

  .stars {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--ghost);
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.8; }
  }

  .bat {
    position: absolute;
    font-size: 1.1rem;
    opacity: 0.75;
    animation: flap 2.4s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(0.92); }
  }

  .wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 560px;
    width: 100%;
  }

  .eyebrow {
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    color: var(--pumpkin);
    margin-bottom: 6px;
    font-weight: 800;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.1rem, 7vw, 3.4rem);
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1.05;
    color: var(--pumpkin);
    text-shadow: 0 0 22px rgba(255,138,30,0.4);
    letter-spacing: 0.01em;
  }

  .date-line {
    font-size: 1.05rem;
    color: var(--ghost);
    opacity: 0.85;
    margin-bottom: 28px;
  }

  .castle {
    width: min(72vw, 260px);
    height: auto;
    margin-bottom: 8px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
  }

  .timer {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: nowrap;
    margin: 18px 0 8px;
  }

  .unit {
    background: rgba(122,79,181,0.22);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,138,30,0.35);
    border-radius: 14px;
    padding: 14px 10px;
    min-width: 68px;
    flex: 1 1 68px;
    max-width: 90px;
  }

  .num {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 600;
    color: var(--slime);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(126,224,138,0.4);
  }

  .label {
    font-size: 0.72rem;
    text-transform: lowercase;
    color: var(--ghost);
    opacity: 0.75;
    margin-top: 6px;
  }

  .message {
    margin-top: 24px;
    font-size: 1.05rem;
    color: var(--ghost);
    opacity: 0.95;
    min-height: 1.4em;
  }

  .arrived {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    color: var(--pumpkin);
    font-weight: 700;
  }

  .player-wrap {
    margin-top: 24px;
    width: 100%;
    max-width: 320px;
  }
  audio {
    width: 100%;
    border-radius: 999px;
  }

  .button-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .spooky-btn {
    background: rgba(255,138,30,0.16);
    border: 1px solid rgba(255,138,30,0.5);
    color: var(--ghost);
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .spooky-btn:hover {
    background: rgba(255,138,30,0.3);
  }
  .spooky-btn:focus-visible {
    outline: 2px solid var(--slime);
    outline-offset: 2px;
  }

  #fireworksCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  footer {
    position: relative;
    z-index: 2;
    margin-top: 36px;
    font-size: 0.8rem;
    color: var(--ghost);
    opacity: 0.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .bat { animation: none; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="bat" style="top:8%; left:12%;">🦇</div>
  <div class="bat" style="top:14%; left:78%; animation-delay:0.6s;">🦇</div>
  <div class="bat" style="top:22%; left:45%; animation-delay:1.2s;">🦇</div>

  <div class="wrap">
    <div class="eyebrow">the magic is almost here 🎃</div>
    <h1>Disneyland</h1>
    <div class="date-line">Saturday, October 10, 2026 · gates open 7:30 AM</div>

    <svg class="castle" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="150" width="300" height="30" fill="#1f1030"/>
      <rect x="100" y="90" width="100" height="60" fill="#3d2a5c"/>
      <rect x="120" y="60" width="60" height="90" fill="#4a3470"/>
      <rect x="140" y="30" width="20" height="120" fill="#5a4080"/>
      <polygon points="140,30 150,5 160,30" fill="#ff8a1e"/>
      <rect x="80" y="110" width="20" height="40" fill="#3d2a5c"/>
      <polygon points="80,110 90,90 100,110" fill="#ff8a1e"/>
      <rect x="200" y="110" width="20" height="40" fill="#3d2a5c"/>
      <polygon points="200,110 210,90 220,110" fill="#ff8a1e"/>
      <rect x="60" y="130" width="16" height="20" fill="#2f2049"/>
      <polygon points="60,130 68,115 76,130" fill="#d9660a"/>
      <rect x="224" y="130" width="16" height="20" fill="#2f2049"/>
      <polygon points="224,130 232,115 240,130" fill="#d9660a"/>
      <circle cx="150" cy="15" r="3" fill="#7ee08a"/>
      <rect x="135" y="120" width="30" height="30" rx="15" fill="#0f0818"/>
      <!-- jack-o'-lantern windows -->
      <circle cx="150" cy="80" r="5" fill="#ff8a1e"/>
      <circle cx="90" cy="100" r="4" fill="#ff8a1e"/>
      <circle cx="210" cy="100" r="4" fill="#ff8a1e"/>
    </svg>

    <div class="timer" id="timer">
      <div class="unit"><div class="num" id="days">--</div><div class="label">days</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">hours</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">mins</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">secs</div></div>
    </div>

    <div class="message" id="message">until the magic begins 🎃</div>

    <div class="player-wrap">
      <audio controls loop preload="auto" src="music.mp3">
        Your browser doesn't support audio playback.
      </audio>
    </div>

    <div class="button-row">
      <button class="spooky-btn" id="fireworksBtn" type="button">
        🎆 fireworks
      </button>
    </div>
  </div>

  <canvas id="fireworksCanvas"></canvas>

  <footer>made for the most magical countdown on earth 🎃</footer>

  <script>
    (function () {
      var starsEl = document.getElementById('stars');
      for (var i = 0; i < 40; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        starsEl.appendChild(s);
      }

      var target = new Date('2026-10-10T07:30:00');
      var daysEl = document.getElementById('days');
      var hoursEl = document.getElementById('hours');
      var minutesEl = document.getElementById('minutes');
      var secondsEl = document.getElementById('seconds');
      var timerEl = document.getElementById('timer');
      var messageEl = document.getElementById('message');

      function pad(n) { return String(n).padStart(2, '0'); }

      function tick() {
        var now = new Date();
        var diff = target - now;

        if (diff <= 0) {
          timerEl.style.display = 'none';
          messageEl.innerHTML = '<span class="arrived">You\'re there! 🎃✨</span>';
          return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        var minutes = Math.floor((diff / (1000 * 60)) % 60);
        var seconds = Math.floor((diff / 1000) % 60);

        daysEl.textContent = days;
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
      }

      tick();
      setInterval(tick, 1000);

      // --- Fireworks ---
      var canvas = document.getElementById('fireworksCanvas');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      var fireworkColors = ['#ff8a1e', '#7ee08a', '#7a4fb5', '#f3ead9', '#d9660a'];

      function spawnBurst(x, y) {
        var color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
        var count = 36;
        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count;
          var speed = 2 + Math.random() * 2.5;
          particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: color
          });
        }
      }

      function launchFireworks() {
        if (reduceMotion) {
          spawnBurst(canvas.width / 2, canvas.height / 3);
          renderStatic();
          return;
        }
        var bursts = 4;
        for (var b = 0; b < bursts; b++) {
          (function (i) {
            setTimeout(function () {
              var x = canvas.width * (0.25 + Math.random() * 0.5);
              var y = canvas.height * (0.2 + Math.random() * 0.35);
              spawnBurst(x, y);
            }, i * 350);
          })(b);
        }
        if (!animating) {
          animating = true;
          requestAnimationFrame(animate);
        }
      }

      function renderStatic() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(function (p) {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
        setTimeout(function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles = [];
        }, 900);
      }

      var animating = false;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(function (p) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.045;
          p.life -= 0.015;
        });
        particles = particles.filter(function (p) { return p.life > 0; });

        particles.forEach(function (p) {
          ctx.globalAlpha = Math.max(p.life, 0);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        if (particles.length > 0) {
          requestAnimationFrame(animate);
        } else {
          animating = false;
        }
      }

      document.getElementById('fireworksBtn').addEventListener('click', function () {
        launchFireworks();
      });
    })();
  </script>
</body>
</html>
