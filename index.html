<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown to Disneyland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #2b4c8c;
    --sky-mid: #5a7fc4;
    --sky-bottom: #f2b6a0;
    --gold: #f4c542;
    --cream: #fff8ec;
    --ink: #1f2540;
    --lilac: #a98fce;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    color: var(--cream);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 48px;
    position: relative;
    overflow-x: hidden;
  }

  .stars {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--cream);
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.9; }
  }

  .wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 560px;
    width: 100%;
  }

  .eyebrow {
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin-bottom: 6px;
    font-weight: 600;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2rem, 7vw, 3.2rem);
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1.05;
  }

  .date-line {
    font-size: 1.05rem;
    color: var(--cream);
    opacity: 0.85;
    margin-bottom: 34px;
  }

  .castle {
    width: min(70vw, 260px);
    height: auto;
    margin-bottom: 8px;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.25));
  }

  .timer {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: nowrap;
    margin: 18px 0 8px;
  }

  .unit {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 14px;
    padding: 14px 10px;
    min-width: 68px;
    flex: 1 1 68px;
    max-width: 90px;
  }

  .num {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .label {
    font-size: 0.72rem;
    text-transform: lowercase;
    color: var(--cream);
    opacity: 0.8;
    margin-top: 6px;
  }

  .message {
    margin-top: 26px;
    font-size: 1.05rem;
    color: var(--cream);
    opacity: 0.95;
    min-height: 1.4em;
  }

  .arrived {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    color: var(--gold);
    font-weight: 700;
  }

  .button-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .music-toggle {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    color: var(--cream);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.9rem;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .music-toggle:hover {
    background: rgba(255,255,255,0.24);
  }
  .music-toggle:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  #fireworksCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  footer {
    position: relative;
    z-index: 2;
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--cream);
    opacity: 0.55;
  }

  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="wrap">
    <div class="eyebrow">the countdown is on</div>
    <h1>Disneyland</h1>
    <div class="date-line">Saturday, October 10, 2026 · gates open 7:30 AM</div>

    <svg class="castle" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="150" width="300" height="30" fill="#3a2f5c"/>
      <rect x="100" y="90" width="100" height="60" fill="#c9a5d9"/>
      <rect x="120" y="60" width="60" height="90" fill="#dab8e6"/>
      <rect x="140" y="30" width="20" height="120" fill="#e8cdf0"/>
      <polygon points="140,30 150,5 160,30" fill="#5a3d7a"/>
      <rect x="80" y="110" width="20" height="40" fill="#c9a5d9"/>
      <polygon points="80,110 90,90 100,110" fill="#5a3d7a"/>
      <rect x="200" y="110" width="20" height="40" fill="#c9a5d9"/>
      <polygon points="200,110 210,90 220,110" fill="#5a3d7a"/>
      <rect x="60" y="130" width="16" height="20" fill="#b590c9"/>
      <polygon points="60,130 68,115 76,130" fill="#4a2f68"/>
      <rect x="224" y="130" width="16" height="20" fill="#b590c9"/>
      <polygon points="224,130 232,115 240,130" fill="#4a2f68"/>
      <circle cx="150" cy="15" r="3" fill="#f4c542"/>
      <rect x="135" y="120" width="30" height="30" rx="15" fill="#3a2f5c"/>
    </svg>

    <div class="timer" id="timer">
      <div class="unit"><div class="num" id="days">--</div><div class="label">days</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">hours</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">mins</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">secs</div></div>
    </div>

    <div class="message" id="message">until the gates open</div>

    <div class="button-row">
      <button class="music-toggle" id="fireworksBtn" type="button">
        🎆 <span>fireworks</span>
      </button>
    </div>
    <audio id="bgMusic" src="music.mp3" loop preload="auto" autoplay playsinline></audio>
  </div>

  <canvas id="fireworksCanvas"></canvas>

  <footer>made for the happiest countdown on earth</footer>

  <script>
    (function () {
      var starsEl = document.getElementById('stars');
      for (var i = 0; i < 40; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        starsEl.appendChild(s);
      }

      var target = new Date('2026-10-10T07:30:00');
      var daysEl = document.getElementById('days');
      var hoursEl = document.getElementById('hours');
      var minutesEl = document.getElementById('minutes');
      var secondsEl = document.getElementById('seconds');
      var timerEl = document.getElementById('timer');
      var messageEl = document.getElementById('message');

      function pad(n) { return String(n).padStart(2, '0'); }

      function tick() {
        var now = new Date();
        var diff = target - now;

        if (diff <= 0) {
          timerEl.style.display = 'none';
          messageEl.innerHTML = '<span class="arrived">You\'re there! ✨</span>';
          return;
        }

        var days = Math.floor(diff / (1000 * 60 * 60 * 24));
        var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        var minutes = Math.floor((diff / (1000 * 60)) % 60);
        var seconds = Math.floor((diff / 1000) % 60);

        daysEl.textContent = days;
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
      }

      tick();
      setInterval(tick, 1000);

      // --- Plays a user-supplied audio file (music.mp3) sitting next to this page ---
      var bgMusic = document.getElementById('bgMusic');

      // Try to autoplay as soon as the page loads.
      // Most mobile browsers block audio with sound until the visitor
      // interacts with the page at least once — if that happens, we
      // fall back to starting music on their very first tap anywhere.
      function attemptAutoplay() {
        bgMusic.play().catch(function () {
          var startOnFirstTap = function () {
            bgMusic.play().catch(function () {});
            document.removeEventListener('click', startOnFirstTap, true);
            document.removeEventListener('touchstart', startOnFirstTap, true);
          };
          document.addEventListener('click', startOnFirstTap, true);
          document.addEventListener('touchstart', startOnFirstTap, true);
        });
      }
      attemptAutoplay();

      // --- Fireworks ---
      var canvas = document.getElementById('fireworksCanvas');
      var ctx = canvas.getContext('2d');
      var particles = [];
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      var fireworkColors = ['#f4c542', '#f2b6a0', '#a98fce', '#fff8ec', '#5a7fc4'];

      function spawnBurst(x, y) {
        var color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
        var count = 36;
        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count;
          var speed = 2 + Math.random() * 2.5;
          particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: color
          });
        }
      }

      function launchFireworks() {
        if (reduceMotion) {
          // Respect reduced motion: show a brief static sparkle instead of animation.
          spawnBurst(canvas.width / 2, canvas.height / 3);
          renderStatic();
          return;
        }
        var bursts = 4;
        for (var b = 0; b < bursts; b++) {
          (function (i) {
            setTimeout(function () {
              var x = canvas.width * (0.25 + Math.random() * 0.5);
              var y = canvas.height * (0.2 + Math.random() * 0.35);
              spawnBurst(x, y);
            }, i * 350);
          })(b);
        }
        if (!animating) {
          animating = true;
          requestAnimationFrame(animate);
        }
      }

      function renderStatic() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(function (p) {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
        setTimeout(function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles = [];
        }, 900);
      }

      var animating = false;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(function (p) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.045; // gravity
          p.life -= 0.015;
        });
        particles = particles.filter(function (p) { return p.life > 0; });

        particles.forEach(function (p) {
          ctx.globalAlpha = Math.max(p.life, 0);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        if (particles.length > 0) {
          requestAnimationFrame(animate);
        } else {
          animating = false;
        }
      }

      document.getElementById('fireworksBtn').addEventListener('click', function () {
        launchFireworks();
      });
    })();
  </script>
</body>
</html>
