<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07061c">
<title>Countdown to Disneyland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f6c85f;
    --gold-hi: #fff0b8;
    --gold-lo: #c8902e;
    --cream: #fff6e0;
    --pumpkin: #ff8a1e;
    --font-display: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --font-num: 'Cinzel', Georgia, serif;
    --font-text: 'Cormorant Garamond', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { background: #07061c; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; min-height: 100%; }

  body {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(34px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
    color: var(--cream);
    font-family: var(--font-text);
    font-size: 18px;
    background: #07061c;
  }

  /* ---------- Twilight sky ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(120% 55% at 50% 108%, rgba(255,138,30,.40) 0%, rgba(212,86,138,.28) 38%, transparent 72%),
      linear-gradient(180deg, #05041a 0%, #0d0833 28%, #251058 55%, #52207a 78%, #8a2f77 100%);
  }
  .nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    will-change: transform;
  }
  .nebula.a {
    width: 60vmax; height: 60vmax; left: -22vmax; top: -20vmax;
    background: radial-gradient(circle, rgba(122,79,181,.55), transparent 65%);
    animation: drift 28s ease-in-out infinite alternate;
  }
  .nebula.b {
    width: 52vmax; height: 52vmax; right: -20vmax; top: 18vmax;
    background: radial-gradient(circle, rgba(255,138,30,.26), transparent 65%);
    animation: drift 36s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); } }

  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: .95; transform: scale(1.15); } }

  .shooting {
    position: absolute;
    width: 120px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    box-shadow: 0 0 8px rgba(255,255,255,.8);
    opacity: 0;
    transform: rotate(28deg);
    animation: shoot 1.1s ease-out forwards;
  }
  @keyframes shoot {
    0%   { opacity: 0; transform: rotate(28deg) translateX(-40px); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: rotate(28deg) translateX(340px); }
  }

  .moon {
    position: absolute;
    top: calc(5% + env(safe-area-inset-top, 0px));
    right: 9%;
    width: clamp(56px, 13vw, 100px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fffdf0 0%, #f6e8c0 55%, #d9bf88 100%);
    box-shadow: 0 0 40px 10px rgba(255,235,170,.28), 0 0 130px 44px rgba(255,200,120,.14);
    animation: moonGlow 7s ease-in-out infinite;
  }
  .moon::before, .moon::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(160,130,80,.18);
  }
  .moon::before { width: 22%; height: 22%; left: 56%; top: 22%; }
  .moon::after  { width: 14%; height: 14%; left: 24%; top: 58%; }
  @keyframes moonGlow {
    0%,100% { box-shadow: 0 0 40px 10px rgba(255,235,170,.28), 0 0 130px 44px rgba(255,200,120,.14); }
    50%     { box-shadow: 0 0 52px 14px rgba(255,235,170,.38), 0 0 150px 56px rgba(255,200,120,.20); }
  }

  .bat {
    position: absolute;
    top: var(--top);
    left: 0;
    width: calc(34px * var(--s, 1));
    animation: cross var(--dur, 24s) linear infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
  }
  .bat svg {
    display: block;
    width: 100%;
    fill: #0b0724;
    stroke: rgba(190,150,255,.4);
    stroke-width: .6;
    animation: flap .42s ease-in-out infinite alternate;
  }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
  @keyframes cross {
    0%   { transform: translate(-12vw, 0); }
    25%  { transform: translate(20vw, -16px); }
    50%  { transform: translate(56vw, 12px); }
    75%  { transform: translate(86vw, -14px); }
    100% { transform: translate(114vw, 0); }
  }

  /* ---------- Content ---------- */
  .wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 6px;
    font-size: 1.3rem;
    font-style: italic;
    font-weight: 600;
    color: var(--gold);
    animation: fadeIn 1.4s ease both .1s;
  }
  .eyebrow svg {
    width: 12px; height: 12px;
    fill: var(--gold-hi);
    animation: twinkle 2.6s ease-in-out infinite;
  }
  .eyebrow svg:last-child { animation-delay: -1.3s; }

  .title-wrap { filter: drop-shadow(0 0 18px rgba(246,200,95,.38)); }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(2rem, 8.2vw, 4.2rem);
    line-height: 1.1;
    letter-spacing: .06em;
    background: linear-gradient(100deg, #c8902e 0%, #fff0b8 22%, #f6c85f 40%, #fff9de 52%, #e0a73f 68%, #fff0b8 82%, #c8902e 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: titleIn 1.9s cubic-bezier(.2,.7,.2,1) both .2s, shimmer 8s linear 2.2s infinite;
  }
  @keyframes titleIn {
    from { opacity: 0; letter-spacing: .34em; filter: blur(10px); }
    to   { opacity: 1; letter-spacing: .06em; filter: blur(0); }
  }
  @keyframes shimmer {
    from { background-position: 0% 0; }
    to   { background-position: -166.667% 0; }
  }

  .date-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px 12px;
    margin: 10px 0 0;
    font-size: 1.2rem;
    font-weight: 500;
    letter-spacing: .02em;
    opacity: .9;
    animation: fadeIn 1.4s ease both .9s;
  }
  .date-line .dot {
    width: 7px; height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(246,200,95,.8);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Castle ---------- */
  .castle-stage {
    position: relative;
    width: min(94vw, 560px);
    margin: 4px 0 -6px;
    animation: castleIn 1.8s cubic-bezier(.2,.7,.2,1) both .5s;
  }
  .castle-stage::before {
    content: '';
    position: absolute;
    inset: -8% -10% 6% -10%;
    background: radial-gradient(50% 56% at 50% 62%, rgba(255,138,30,.50), rgba(212,86,138,.28) 46%, transparent 74%);
    filter: blur(20px);
    animation: castleGlow 6s ease-in-out infinite;
  }
  .castle-stage svg { position: relative; display: block; width: 100%; height: auto; overflow: visible; }
  @keyframes castleIn {
    from { opacity: 0; transform: translateY(22px); filter: brightness(.4); }
    to   { opacity: 1; transform: translateY(0); filter: brightness(1); }
  }
  @keyframes castleGlow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

  .win { animation: flick var(--d, 3.2s) ease-in-out infinite; animation-delay: var(--l, 0s); }
  @keyframes flick {
    0%,100% { opacity: 1; }
    42% { opacity: .82; }
    50% { opacity: .5; }
    58% { opacity: .92; }
  }
  .tw { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flag { transform-box: fill-box; transform-origin: left center; animation: wave 2.2s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: skewY(-8deg) scaleX(1); } to { transform: skewY(8deg) scaleX(.82); } }

  /* ---------- Countdown dials ---------- */
  .timer {
    display: flex;
    justify-content: center;
    gap: clamp(8px, 3vw, 22px);
    margin: 0;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: clamp(68px, 20vw, 108px);
    animation: unitIn .9s cubic-bezier(.2,.7,.2,1) both;
    animation-delay: calc(1.2s + var(--i) * .13s);
  }
  @keyframes unitIn { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }

  .dial { position: relative; width: 100%; aspect-ratio: 1; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .track { fill: rgba(18,9,52,.62); stroke: rgba(246,200,95,.2); stroke-width: 2.2; }
  .prog {
    fill: none;
    stroke: url(#goldRing);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-dasharray: 289.03;
    stroke-dashoffset: 289.03;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 4px rgba(246,200,95,.75));
  }
  .num {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--font-num);
    font-weight: 600;
    font-size: clamp(1.35rem, 6.2vw, 2.3rem);
    color: var(--gold-hi);
    text-shadow: 0 0 14px rgba(246,200,95,.55);
    font-variant-numeric: tabular-nums;
  }
  .num.pop { animation: pop .5s ease-out; }
  @keyframes pop {
    0%   { transform: translateY(-9%); opacity: .25; filter: blur(2px); }
    100% { transform: translateY(0); opacity: 1; filter: blur(0); }
  }
  .label { font-size: 1.05rem; font-style: italic; font-weight: 500; opacity: .82; }

  /* ---------- Message ---------- */
  .ornament {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(260px, 70%);
    margin: 18px 0 8px;
    color: var(--gold);
    animation: fadeIn 1.4s ease both 1.9s;
  }
  .ornament::before, .ornament::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(246,200,95,.7));
  }
  .ornament::after { transform: scaleX(-1); }
  .ornament svg { width: 12px; height: 12px; fill: currentColor; }

  .message {
    min-height: 2em;
    margin: 0;
    font-size: 1.5rem;
    font-style: italic;
    font-weight: 500;
    transition: opacity .5s ease, transform .5s ease;
    animation: fadeIn 1.4s ease both 2s;
  }
  .message.swap { opacity: 0; transform: translateY(6px); }
  .arrived {
    font-family: var(--font-display);
    font-style: normal;
    font-weight: 700;
    font-size: clamp(1.4rem, 5.4vw, 2rem);
    color: var(--gold-hi);
    text-shadow: 0 0 20px rgba(246,200,95,.6);
  }

  /* ---------- Controls ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 22px;
    animation: fadeIn 1.4s ease both 2.2s;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 46px;
    padding: 0 20px 0 15px;
    border: 1px solid rgba(246,200,95,.55);
    border-radius: 999px;
    background: rgba(20,10,60,.5);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--cream);
    font: 600 1.1rem var(--font-text);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .pill:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(246,200,95,.35); background: rgba(40,20,90,.6); }
  .pill:active { transform: translateY(0) scale(.98); }
  .pill:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .pill.primary {
    background: linear-gradient(180deg, #ffe08a, #e2a33a);
    border-color: #ffe9a8;
    color: #2b1450;
  }
  .pill.primary:hover { background: linear-gradient(180deg, #ffe9a8, #eab048); }
  .pill svg { width: 20px; height: 20px; fill: currentColor; flex: none; }

  .i-pause { display: none; }
  .playing .i-pause { display: block; }
  .playing .i-play { display: none; }

  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
  .eq span { width: 3px; height: 4px; border-radius: 2px; background: var(--gold); transition: height .2s; }
  .playing .eq span { animation: eq .9s ease-in-out infinite alternate; }
  .playing .eq span:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
  .playing .eq span:nth-child(3) { animation-delay: -.6s; animation-duration: 1.1s; }
  .playing .eq span:nth-child(4) { animation-delay: -.15s; animation-duration: .8s; }
  @keyframes eq { from { height: 3px; } to { height: 16px; } }

  footer {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    font-size: 1rem;
    font-style: italic;
    opacity: .6;
  }
  footer svg { width: 18px; height: 18px; }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  @media (max-width: 420px) {
    body { font-size: 17px; }
    .pill { width: 100%; max-width: 300px; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <!-- shared gradient for the progress rings -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff0b8"/>
        <stop offset="1" stop-color="#e0a73f"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="sky" id="sky" aria-hidden="true">
    <div class="nebula a"></div>
    <div class="nebula b"></div>
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="bat" style="--top:11%;--dur:26s;--delay:-6s;--s:1"><svg viewBox="0 0 24 14"><path d="M12 5C11 3 10 2.5 9 3C8 1.5 6 1 5 2C5 5 3 6 0 6.5C2 7 3 8.5 4 10.5C5.5 9 7 8.8 8.5 9.5C9.5 10.5 11 12 12 14C13 12 14.5 10.5 15.5 9.5C17 8.8 18.5 9 20 10.5C21 8.5 22 7 24 6.5C21 6 19 5 19 2C18 1 16 1.5 15 3C14 2.5 13 3 12 5Z"/></svg></div>
    <div class="bat" style="--top:19%;--dur:34s;--delay:-20s;--s:.75"><svg viewBox="0 0 24 14"><path d="M12 5C11 3 10 2.5 9 3C8 1.5 6 1 5 2C5 5 3 6 0 6.5C2 7 3 8.5 4 10.5C5.5 9 7 8.8 8.5 9.5C9.5 10.5 11 12 12 14C13 12 14.5 10.5 15.5 9.5C17 8.8 18.5 9 20 10.5C21 8.5 22 7 24 6.5C21 6 19 5 19 2C18 1 16 1.5 15 3C14 2.5 13 3 12 5Z"/></svg></div>
    <div class="bat" style="--top:8%;--dur:42s;--delay:-30s;--s:.6"><svg viewBox="0 0 24 14"><path d="M12 5C11 3 10 2.5 9 3C8 1.5 6 1 5 2C5 5 3 6 0 6.5C2 7 3 8.5 4 10.5C5.5 9 7 8.8 8.5 9.5C9.5 10.5 11 12 12 14C13 12 14.5 10.5 15.5 9.5C17 8.8 18.5 9 20 10.5C21 8.5 22 7 24 6.5C21 6 19 5 19 2C18 1 16 1.5 15 3C14 2.5 13 3 12 5Z"/></svg></div>
  </div>

  <main class="wrap">
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>
      <span id="eyebrowText">The magic is almost here</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>
    </p>

    <div class="title-wrap"><h1>Disneyland</h1></div>

    <p class="date-line">
      <span>Saturday, October 10, 2026</span>
      <span class="dot" aria-hidden="true"></span>
      <span>Gates open at 7:30 AM</span>
    </p>

    <div class="castle-stage" id="castle">
      <svg viewBox="0 -8 800 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A fairytale castle glowing at twilight">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3aa6"/><stop offset="1" stop-color="#1c0f45"/></linearGradient>
          <linearGradient id="wallBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e2784"/><stop offset="1" stop-color="#170b3c"/></linearGradient>
          <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8679f"/><stop offset="1" stop-color="#6a2aa8"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset="1" stop-color="#c8902e"/></linearGradient>
          <radialGradient id="gate" cx=".5" cy=".85" r=".85"><stop offset="0" stop-color="#ffe3a0"/><stop offset=".55" stop-color="#ff8a1e"/><stop offset="1" stop-color="#7a2fb8"/></radialGradient>
          <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1c0f45"/>
            <stop offset=".5" stop-color="#120a30"/>
            <stop offset="1" stop-color="#120a30" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="fx" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#000"/><stop offset=".14" stop-color="#fff"/>
            <stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
          </linearGradient>
          <mask id="mfx"><rect x="0" y="-8" width="800" height="448" fill="url(#fx)"/></mask>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- far towers -->
        <g stroke="rgba(214,170,255,.2)" stroke-width="1">
          <rect x="205" y="250" width="34" height="100" fill="url(#wallBack)"/>
          <rect x="561" y="250" width="34" height="100" fill="url(#wallBack)"/>
          <rect x="272" y="200" width="36" height="150" fill="url(#wallBack)"/>
          <rect x="492" y="200" width="36" height="150" fill="url(#wallBack)"/>
        </g>
        <!-- main wall and keep -->
        <rect x="215" y="320" width="370" height="40" fill="url(#wallBack)"/>
        <line x1="215" y1="318" x2="585" y2="318" stroke="#2e1b66" stroke-width="9" stroke-dasharray="10 8"/>
        <rect x="300" y="245" width="200" height="110" fill="url(#wall)" stroke="rgba(214,170,255,.22)"/>
        <line x1="300" y1="243" x2="500" y2="243" stroke="#3a2480" stroke-width="9" stroke-dasharray="10 8"/>

        <!-- mid towers + center tower -->
        <g stroke="rgba(214,170,255,.25)" stroke-width="1">
          <rect x="327" y="142" width="36" height="208" fill="url(#wall)"/>
          <rect x="437" y="142" width="36" height="208" fill="url(#wall)"/>
          <rect x="381" y="102" width="38" height="248" fill="url(#wall)"/>
        </g>

        <!-- roofs -->
        <g stroke="rgba(255,214,235,.5)" stroke-width="1" stroke-linejoin="round">
          <g opacity=".85">
            <polygon points="200,250 222,190 244,250" fill="url(#roof)"/>
            <polygon points="556,250 578,190 600,250" fill="url(#roof)"/>
            <polygon points="266,200 290,128 314,200" fill="url(#roof)"/>
            <polygon points="486,200 510,128 534,200" fill="url(#roof)"/>
          </g>
          <polygon points="322,142 345,62 368,142" fill="url(#roof)"/>
          <polygon points="432,142 455,62 478,142" fill="url(#roof)"/>
          <polygon points="375,102 400,14 425,102" fill="url(#roof)"/>
        </g>

        <!-- gold cornices + finials -->
        <g fill="url(#gold)" opacity=".85">
          <rect x="377" y="100" width="46" height="5" rx="2"/>
          <rect x="323" y="140" width="44" height="5" rx="2"/>
          <rect x="433" y="140" width="44" height="5" rx="2"/>
          <rect x="268" y="198" width="44" height="4" rx="2"/>
          <rect x="488" y="198" width="44" height="4" rx="2"/>
          <rect x="201" y="248" width="42" height="4" rx="2"/>
          <rect x="557" y="248" width="42" height="4" rx="2"/>
        </g>
        <g stroke="url(#gold)" stroke-width="1.6" fill="none">

        <!-- windows -->
        <g filter="url(#glow)">
          <rect class="win" x="394" y="128" width="12" height="24" rx="6" fill="#ffd27a" style="--d:3.1s;--l:-.4s"/>
          <rect class="win" x="394" y="172" width="12" height="24" rx="6" fill="#ff8a1e" style="--d:4.2s;--l:-1.7s"/>
          <rect class="win" x="394" y="216" width="12" height="24" rx="6" fill="#ffd27a" style="--d:2.8s;--l:-2.1s"/>
          <rect class="win" x="339" y="170" width="12" height="24" rx="6" fill="#ffd27a" style="--d:3.6s;--l:-.9s"/>
          <rect class="win" x="339" y="218" width="12" height="24" rx="6" fill="#d2b0ff" style="--d:4.6s;--l:-2.6s"/>
          <rect class="win" x="449" y="170" width="12" height="24" rx="6" fill="#ffd27a" style="--d:3.3s;--l:-1.2s"/>
          <rect class="win" x="449" y="218" width="12" height="24" rx="6" fill="#d2b0ff" style="--d:3.9s;--l:-.2s"/>
          <rect class="win" x="284" y="226" width="12" height="22" rx="6" fill="#ff8a1e" style="--d:3.4s;--l:-1.4s"/>
          <rect class="win" x="504" y="226" width="12" height="22" rx="6" fill="#ff8a1e" style="--d:4.1s;--l:-2.9s"/>
          <rect class="win" x="217" y="272" width="10" height="20" rx="5" fill="#ffd27a" style="--d:3.7s;--l:-.6s"/>
          <rect class="win" x="573" y="272" width="10" height="20" rx="5" fill="#ffd27a" style="--d:2.9s;--l:-1.9s"/>
          <rect class="win" x="310" y="268" width="12" height="22" rx="6" fill="#d2b0ff" style="--d:4.4s;--l:-1s"/>
          <rect class="win" x="478" y="268" width="12" height="22" rx="6" fill="#d2b0ff" style="--d:3.2s;--l:-2.3s"/>

        <!-- gate -->
        <path d="M372 350V304Q372 276 400 276Q428 276 428 304V350Z" fill="#0a0518" stroke="url(#gold)" stroke-width="1.5"/>
        <path class="win" d="M381 350V306Q381 285 400 285Q419 285 419 306V350Z" fill="url(#gate)" style="--d:5s;--l:-1s"/>

        <!-- ground -->
        <g mask="url(#mfx)">
          <path d="M0 440L0 372C120 352 240 346 400 346C560 346 680 352 800 372L800 440Z" fill="url(#ground)"/>
          <path d="M0 372C120 352 240 346 400 346C560 346 680 352 800 372" fill="none" stroke="rgba(255,160,90,.35)" stroke-width="1.2"/>
        </g>

    <div class="timer" id="timer" role="timer" aria-label="Time remaining until Disneyland">

        </div>

      <div class="unit" style="--i:2">
        <div class="dial">

        <div class="dial">

        <div class="label" id="lblSecs">seconds</div>
      </div>

    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>
    </div>

    <p class="message" id="message"><span id="msgText">until the magic begins</span></p>

    <div class="actions">
      <button class="pill" id="playBtn" type="button" aria-pressed="false" aria-label="Play music">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span id="trackLabel">Play the music</span>
      </button>
      <button class="pill primary" id="fireworksBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>
        <span>Launch fireworks</span>

    <audio id="bgm" loop preload="auto" src="music.mp3"></audio>
  </main>

  <footer>
    <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="14.5" rx="9" ry="7" fill="#ff8a1e"/><ellipse cx="7.8" cy="14.5" rx="3.6" ry="6.6" fill="#ffa84d" opacity=".55"/><rect x="11" y="4" width="2.2" height="4" rx="1" fill="#6b8f3a"/></svg>
    <span>made for the most magical countdown on earth</span>
  </footer>

  <canvas id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(id) { return document.getElementById(id); }
  var arrived = false;

  /* ---------- Stars ---------- */
  (function () {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 110; i++) {
      var s = document.createElement('i');
      var r = Math.random();
      var size = r < 0.12 ? 3 : (r < 0.45 ? 2 : 1.5);
      s.style.cssText =
        'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 72) + '%;' +
        'width:' + size + 'px;height:' + size + 'px;' +
        'animation-duration:' + (2.5 + Math.random() * 4) + 's;' +
        'animation-delay:-' + (Math.random() * 6) + 's';
      frag.appendChild(s);
    }
    $('stars').appendChild(frag);
  })();

  /* ---------- Shooting stars ---------- */
  (function () {
    if (reduce) return;
    var sky = $('sky');
    function shoot() {
      if (!document.hidden) {
        var el = document.createElement('span');
        el.className = 'shooting';
        el.style.left = (8 + Math.random() * 62) + '%';
        el.style.top = (3 + Math.random() * 30) + '%';
        sky.appendChild(el);
        el.addEventListener('animationend', function () { el.remove(); });
      }
      setTimeout(shoot, 4500 + Math.random() * 8000);
    }
    setTimeout(shoot, 2600);
  })();

  /* ---------- Countdown ---------- */
  var target = new Date('2026-10-10T07:30:00');
  var C = 2 * Math.PI * 46;
  var els = { d: $('days'), h: $('hours'), m: $('minutes'), s: $('seconds') };
  var rings = { d: $('rd'), h: $('rh'), m: $('rm'), s: $('rs') };
  var lbls = { d: $('lblDays'), h: $('lblHours'), m: $('lblMins'), s: $('lblSecs') };
  var names = { d: ['day', 'days'], h: ['hour', 'hours'], m: ['minute', 'minutes'], s: ['second', 'seconds'] };
  var lastText = {}, lastFrac = {}, firstTick = true;
  var timerEl = $('timer'), msgEl = $('message');

  function pad(n) { return String(n).padStart(2, '0'); }

  function setNum(k, text, n) {
    if (lastText[k] === text) return;
    lastText[k] = text;
    els[k].textContent = text;
    lbls[k].textContent = names[k][n === 1 ? 0 : 1];
    if (!reduce && !firstTick) {
      els[k].classList.remove('pop');
      void els[k].offsetWidth;
      els[k].classList.add('pop');
    }
  }

  function setRing(k, frac) {
    var r = rings[k];
    frac = Math.max(0, Math.min(1, frac));
    var prev = lastFrac[k];
    if (prev !== undefined && frac > prev + 0.02) {
      r.style.transition = 'none';
      r.style.strokeDashoffset = C * (1 - frac);
      void r.getBoundingClientRect();
      r.style.transition = '';
    } else {
      r.style.strokeDashoffset = C * (1 - frac);
    }
    lastFrac[k] = frac;
  }

  function tick() {
    var diff = target - new Date();
    if (diff <= 0) { arrive(); return; }
    var days = Math.floor(diff / 864e5);
    var hours = Math.floor(diff / 36e5 % 24);
    var minutes = Math.floor(diff / 6e4 % 60);
    var seconds = Math.floor(diff / 1e3 % 60);
    setNum('d', String(days), days);
    setNum('h', pad(hours), hours);
    setNum('m', pad(minutes), minutes);
    setNum('s', pad(seconds), seconds);
    setRing('d', diff / (30 * 864e5));
    setRing('h', (hours + minutes / 60) / 24);
    setRing('m', (minutes + seconds / 60) / 60);
    setRing('s', seconds / 60);
    firstTick = false;
  }

  function loopTick() {
    if (arrived) return;
    tick();
    setTimeout(loopTick, 1000 - (Date.now() % 1000) + 5);
  }

  function arrive() {
    if (arrived) return;
    arrived = true;
    timerEl.style.display = 'none';
    $('eyebrowText').textContent = 'Today is the day';
    msgEl.innerHTML = '<span class="arrived">You\u2019re here! Let the magic begin.</span>';
    celebrate();
  }

  /* ---------- Rotating message ---------- */
  (function () {
    if (reduce) return;
    var lines = [
      'until the magic begins',
      'Halloween Time is waiting for you',
      'the pixie dust is packed and ready',
      'your first churro is getting closer'
    ];
    var i = 0, text = $('msgText');
    setInterval(function () {
      if (arrived) return;
      msgEl.classList.add('swap');
      setTimeout(function () {
        if (arrived) return;
        i = (i + 1) % lines.length;
        text.textContent = lines[i];
        msgEl.classList.remove('swap');
      }, 520);
    }, 6500);
  })();

  /* ---------- Particles: fireworks, pixie dust, sparkles ---------- */
  var canvas = $('fx');
  var ctx = canvas.getContext('2d');
  if (!ctx) { var note = document.createElement('div'); note.textContent = 'Canvas not supported in this browser'; note.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;color:#fff;font:12px monospace'; document.body.appendChild(note); }
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var parts = [], rockets = [], flashes = [];
  var pixie = { x: -50, y: -50, on: false };
  var castleEl = $('castle');
  var t0 = performance.now();

  function resize() {
    W = window.innerWidth || document.documentElement.clientWidth || 360;
    H = window.innerHeight || document.documentElement.clientHeight || 640;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var palette = [
    ['#ffd56b', '#fff1c2'],
    ['#ff5fa8', '#ffc2de'],
    ['#a98bff', '#ddd0ff'],
    ['#ff8a1e', '#ffd0a0'],
    ['#7fe3ff', '#d4f6ff'],
    ['#8cf0a0', '#d6ffe0']
  ];
  var dustColors = ['#fff1c2', '#ffd56b', '#ffffff', '#ffc2de', '#ffb347'];

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function burst(x, y, pal, big) {
    var scale = Math.max(0.6, Math.min(1.2, Math.min(W, H) / 650));
    var rings = big ? 2 : 1;
    var ringShape = Math.random() < 0.5;
    for (var r = 0; r < rings; r++) {
      var n = r === 0 ? (big ? 84 : 64) : 40;
      var base = (r === 0 ? 4.2 : 2.3) * scale;
      for (var i = 0; i < n; i++) {
        var a = Math.PI * 2 * i / n + Math.random() * 0.08;
        var sp = ringShape || r === 1 ? base : base * (0.35 + Math.random() * 0.65);
        parts.push({
          x: x, y: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: 0.010 + Math.random() * 0.008,
          size: 1.5 + Math.random() * 1.2,
          color: Math.random() < 0.72 ? pal[0] : pal[1],
          g: 0.045, drag: 0.975, streak: true, tw: false
        });
      }
    }
    flashes.push({ x: x, y: y, life: 1 });
  }

  function launch(big) {
    resize();
    ensureLoop();
    var ty = H * (0.12 + Math.random() * 0.3);
    rockets.push({
      x: W * (0.2 + Math.random() * 0.6),
      y: H + 10,
      vx: (Math.random() - 0.5) * 0.8,
      vy: -Math.sqrt(2 * 0.09 * (H - ty)),
      pal: pick(palette),
      big: !!big
    });
  }

  function sparkle(x, y, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 0.6 + Math.random() * 2.2;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.4,
        life: 1, decay: 0.02 + Math.random() * 0.02,
        size: 1 + Math.random() * 1.8,
        color: pick(dustColors),
        g: 0.03, drag: 0.95, streak: false, tw: true
      });
    }
  }

  function pixiePosition(now) {
    var r = castleEl.getBoundingClientRect();
    var t = (now - t0) / 1000 * 0.62;
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height * 0.36;
    var ax = r.width * 0.46;
    var ay = r.height * 0.30;
    pixie.x = cx + ax * Math.sin(t) + Math.sin(t * 5) * 3;
    pixie.y = cy + ay * Math.sin(2 * t + 0.4) + Math.cos(t * 7) * 2;
    pixie.on = r.bottom > 0 && r.top < H;
  }

  function step() {
    var i, p;
    for (i = rockets.length - 1; i >= 0; i--) {
      var k = rockets[i];
      k.vy += 0.09; k.x += k.vx; k.y += k.vy;
      parts.push({
        x: k.x, y: k.y,
        vx: (Math.random() - 0.5) * 0.5, vy: Math.random() * 0.5,
        life: 1, decay: 0.05, size: 1.5, color: '#ffe9b0',
        g: 0.02, drag: 0.95, streak: false, tw: false
      });
      if (k.vy > -0.9 || k.y < H * 0.08) {
        burst(k.x, k.y, k.pal, k.big);
        rockets.splice(i, 1);
      }
    }
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.g;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); }
    }
    for (i = flashes.length - 1; i >= 0; i--) {
      flashes[i].life -= 0.06;
      if (flashes[i].life <= 0) flashes.splice(i, 1);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var i, p, g;

    for (i = 0; i < flashes.length; i++) {
      var f = flashes[i];
      var rad = 50 + (1 - f.life) * 170;
      g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
      g.addColorStop(0, 'rgba(255,225,170,' + Math.max(0, f.life * 0.28).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,225,170,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(f.x - rad, f.y - rad, rad * 2, rad * 2);
    }

    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      var a = p.life > 0.5 ? 1 : p.life * 2;
      if (p.tw) a *= 0.55 + Math.random() * 0.45;
      ctx.globalAlpha = a;
      if (p.streak) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.4 + p.life * 0.6), 0, 6.2832);
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;
    for (i = 0; i < rockets.length; i++) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(rockets[i].x, rockets[i].y, 2, 0, 6.2832);
      ctx.fill();
    }

    if (!reduce && pixie.on) {
      g = ctx.createRadialGradient(pixie.x, pixie.y, 0, pixie.x, pixie.y, 24);
      g.addColorStop(0, 'rgba(255,252,230,1)');
      g.addColorStop(0.25, 'rgba(255,225,140,.65)');
      g.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = g;
      ctx.fillRect(pixie.x - 24, pixie.y - 24, 48, 48);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(pixie.x, pixie.y, 2.2, 0, 6.2832);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  var looping = false;
  function ensureLoop() {
    if (!looping) { looping = true; requestAnimationFrame(frame); }
  }

  function frame(now) {
    try { frameInner(now); } catch (err) { showFxError(err); }
    if (!reduce || parts.length || rockets.length || flashes.length) {
      requestAnimationFrame(frame);
    } else {
      looping = false;
    }
  }

  var fxErrShown = false;
  function showFxError(err) {
    parts = []; rockets = []; flashes = [];
    if (fxErrShown) return;
    fxErrShown = true;
    var n = document.createElement('div');
    n.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:8px 10px;border-radius:8px;background:#400;color:#fff;font:12px/1.3 monospace';
    n.textContent = 'Fireworks error: ' + (err && err.message ? err.message : err);
    document.body.appendChild(n);
  }

  function frameInner(now) {
    if (!reduce) pixiePosition(now);
    if (!reduce && pixie.on) {
      for (var i = 0; i < 2; i++) {
        parts.push({
          x: pixie.x + (Math.random() - 0.5) * 4,
          y: pixie.y + (Math.random() - 0.5) * 4,
          vx: (Math.random() - 0.5) * 0.7,
          vy: Math.random() * 0.5 - 0.1,
          life: 1, decay: 0.018 + Math.random() * 0.015,
          size: 0.8 + Math.random() * 1.5,
          color: pick(dustColors),
          g: 0.03, drag: 0.96, streak: false, tw: true
        });
      }
    }
    step();
    render();
  }

  function staticBurst() {
    burst(W / 2, H * 0.3, palette[0], true);
    for (var i = 0; i < 26; i++) step();
    render();
    setTimeout(function () {
      parts = []; flashes = [];
      ctx.clearRect(0, 0, W, H);
    }, 1200);
  }

  function finale(n) {
    for (var i = 0; i < n; i++) setTimeout(launch, i * 260, true);
  }

  function celebrate() {
    if (reduce) { resize(); staticBurst(); } else { finale(10); }
  }

  if (!reduce) {
    ensureLoop();

    var lastTrail = 0;
    window.addEventListener('pointermove', function (e) {
      var now = performance.now();
      if (now - lastTrail < 24) return;
      lastTrail = now;
      sparkle(e.clientX, e.clientY, 2);
    }, { passive: true });

    window.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('button')) return;
      sparkle(e.clientX, e.clientY, 18);
    }, { passive: true });

    // opening moment, then a gentle show every so often
    setTimeout(function () { launch(false); }, 2200);
    (function ambient() {
      var wait = arrived ? 2200 + Math.random() * 1800 : 8000 + Math.random() * 5000;
      setTimeout(function () {
        if (!document.hidden) launch(false);
        ambient();
      }, wait);
    })();
  }

  // Pressing the button is an explicit request, so it always plays the full show
  $('fireworksBtn').addEventListener('click', function () { finale(8); });

  /* ---------- Music ---------- */
  var audio = $('bgm');
  var playBtn = $('playBtn');
  var label = $('trackLabel');

  playBtn.addEventListener('click', function () {
    if (audio.paused) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { label.textContent = 'music.mp3 not found'; });
    } else {
      audio.pause();
    }
  });
  audio.addEventListener('play', function () {
    playBtn.classList.add('playing');
    playBtn.setAttribute('aria-pressed', 'true');
    playBtn.setAttribute('aria-label', 'Pause music');
    label.textContent = 'Now playing';
  });
  audio.addEventListener('pause', function () {
    playBtn.classList.remove('playing');
    playBtn.setAttribute('aria-pressed', 'false');
    playBtn.setAttribute('aria-label', 'Play music');
    label.textContent = 'Play the music';
  });
  audio.addEventListener('error', function () { label.textContent = 'music.mp3 not found'; });

  loopTick();
})();
</script>
</body>
